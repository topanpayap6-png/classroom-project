<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classroom Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; font-family: 'Noto Sans Thai', 'Sarabun', system-ui, sans-serif; background: #f1f5f9; }
  @keyframes av-hop { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-10px) rotate(-3deg) } 70% { transform: translateY(-4px) rotate(3deg) } }
  @keyframes av-droop { 0%,100% { transform: translateY(0) rotate(0) } 30% { transform: translateY(3px) rotate(-3deg) } 60% { transform: translateY(2px) rotate(3deg) } }
  .av-happy { animation: av-hop .55s ease-in-out 3; transform-origin: 50% 100%; }
  .av-sad { animation: av-droop .7s ease-in-out 2; transform-origin: 50% 100%; }

</style>
</head>
<body>
<div id="root"></div>

	gexp : function(n) {

	},

	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];

var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}

		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {

                }
            }

            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }

<script>/* Demo backend: same interface as the Firebase backend, data kept in this browser only (for trying the app before Firebase is set up). */
window.makeDemoBackend = function () {
  const KEY = 'classroom_demo_db_v1', SKEY = 'classroom_demo_session_v1';
  let db = { docs: {}, accounts: {} };
  try { db = JSON.parse(localStorage.getItem(KEY) || 'null') || db; } catch (e) {}

  const files = new Map(), urls = new Map();
  const subs = new Set(), authSubs = new Set();

  const clone = (x) => JSON.parse(JSON.stringify(x === undefined ? null : x));

  const matches = (d, cs) => (cs || []).every(([f, op, v]) => op === '==' ? d[f] === v : op === 'in' ? v.includes(d[f]) : op === 'array-contains' ? Array.isArray(d[f]) && d[f].includes(v) : true);

    if (op.op === 'set') db.docs[op.path] = clone(op.data);
    else if (op.op === 'update') { if (!db.docs[op.path]) throw err('not-found', 'update on missing doc ' + op.path); db.docs[op.path] = { ...db.docs[op.path], ...clone(op.data) }; }
    else if (op.op === 'del') delete db.docs[op.path];
  };

  const currentUser = () => (session && db.accounts[session] ? { uid: session, email: db.accounts[session].email } : null);
  const B = {
    mode: 'demo', onError() {},
    onAuth(cb) { authSubs.add(cb); Promise.resolve().then(() => cb(currentUser())); return () => authSubs.delete(cb); },
    async isSetupDone() { return !!db.docs['config/setup']; },
    async createAccount(email, password) {
      const em = String(email).toLowerCase();
      if (Object.values(db.accounts).some(a => a.email === em)) throw err('auth/email-already-in-use');
      if (String(password).length < 6) throw err('auth/weak-password');
      const uid = 'u' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      db.accounts[uid] = { email: em, password: String(password) }; save(); return uid;
    },

      if (db.docs['config/setup']) throw err('permission-denied', 'setup already done');
      if (String(setupCode).trim() !== 'DEMO') throw err('permission-denied', 'wrong setup code');
      const uid = await B.createAccount(email, password);
      apply({ op: 'set', path: 'users/' + uid, data: { role: 'admin', name, email: String(email).toLowerCase(), rooms: [] } });
      apply({ op: 'set', path: 'config/setup', data: { done: true } });
      session = uid; try { localStorage.setItem(SKEY, uid); } catch (e) {} save(); authNotify(); emit(); return uid;
    },
    async signInTeacher(email, password) {
      const em = String(email).trim().toLowerCase();
      const hit = Object.entries(db.accounts).find(([, a]) => a.email === em);
      if (!hit || hit[1].password !== String(password)) throw err('auth/invalid-credential');
      session = hit[0]; try { localStorage.setItem(SKEY, session); } catch (e) {} authNotify();
    },
    async signInStudent(loginId, pin) {
      const lk = db.docs['studentLookup/' + String(loginId).trim()];
      if (!lk) throw err('auth/invalid-credential');
      await B.signInTeacher(lk.email, pin);
    },
    async signOut() { session = null; try { localStorage.removeItem(SKEY); } catch (e) {} authNotify(); },
    async sendReset(email) { return true; },
    watchProfile(uid, cb) { return sub(() => (db.docs['users/' + uid] ? { ...db.docs['users/' + uid], _id: uid } : null), cb); },

    },

    watchDoc(path, cb) { return sub(() => (db.docs[path] ? { ...db.docs[path], _id: path.split('/')[1] } : null), cb); },
    async set(path, data) { apply({ op: 'set', path, data }); save(); emit(); },
    async update(path, data) { apply({ op: 'update', path, data }); save(); emit(); },
    async del(path) { apply({ op: 'del', path }); save(); emit(); },
    async removeField(path, field) { if (db.docs[path]) { delete db.docs[path][field]; save(); emit(); } },
    async batch(ops) { ops.forEach(apply); save(); emit(); },
    async putFile(path, file) { files.set(path, file); return { path, name: file.name, size: file.size }; },
    async fileUrl(path) { if (!files.has(path)) throw err('storage/object-not-found', 'ไฟล์โหมดทดลองหายหลังรีเฟรชหน้า'); if (!urls.has(path)) urls.set(path, URL.createObjectURL(files.get(path))); return urls.get(path); },
    async delFile(path) { files.delete(path); urls.delete(path); },
    async deleteRoomCascade(roomId) {
      ['students', 'studentSecrets', 'assignments', 'results', 'submissions'].forEach(c => colDocs(c, [['roomId', '==', roomId]]).forEach(d => delete db.docs[c + '/' + d._id]));
      colDocs('users', [['roomId', '==', roomId]]).forEach(d => delete db.docs['users/' + d._id]);
      delete db.docs['rooms/' + roomId]; save(); emit();
    }
  };
  B.__reset = () => { db = { docs: {}, accounts: {} }; session = null; save(); try { localStorage.removeItem(SKEY); } catch (e) {} };
  return B;
};

<script>/* Firebase backend (Auth + Firestore + Storage). Loaded only when firebase-config has been filled in. */
window.makeFirebaseBackend = async function (config) {
  const V = '10.14.1', base = 'https://www.gstatic.com/firebasejs/' + V + '/';
  const [A, Au, F, S] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-storage.js')]);
  const app = A.initializeApp(config), auth = Au.getAuth(app), db = F.getFirestore(app), storage = S.getStorage(app);
  const clean = (x) => JSON.parse(JSON.stringify(x === undefined ? null : x));
  const ref = (path) => F.doc(db, ...path.split('/'));
  const urlCache = new Map();
  const B = { mode: 'firebase', onError() {} };
  const fail = (e) => { try { B.onError(e); } catch (x) {} };
  const listen = (q, cb, map) => F.onSnapshot(q, snap => cb(map(snap)), e => { fail(e); cb(null); });
  B.onAuth = (cb) => Au.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email } : null));
  B.isSetupDone = async () => { const s = await F.getDoc(ref('config/setup')); return s.exists(); };
  B.signInTeacher = (email, password) => Au.signInWithEmailAndPassword(auth, String(email).trim(), String(password));
  B.signInStudent = async (loginId, pin) => {
    const s = await F.getDoc(ref('studentLookup/' + String(loginId).trim()));
    if (!s.exists()) { const e = new Error('unknown student code'); e.code = 'auth/invalid-credential'; throw e; }
    return Au.signInWithEmailAndPassword(auth, s.data().email, String(pin));
  };
  B.signOut = () => Au.signOut(auth);
  B.sendReset = (email) => Au.sendPasswordResetEmail(auth, String(email).trim());
  B.createAccount = async (email, password) => {
    const sec = A.initializeApp(config, 'secondary-' + Date.now()), sauth = Au.getAuth(sec);
    try { const c = await Au.createUserWithEmailAndPassword(sauth, String(email).trim(), String(password)); const uid = c.user.uid; await Au.signOut(sauth); return uid; }
    finally { try { await A.deleteApp(sec); } catch (e) {} }
  };
  B.bootstrapAdmin = async ({ setupCode, name, email, password }) => {
    const c = await Au.createUserWithEmailAndPassword(auth, String(email).trim(), String(password));
    const uid = c.user.uid, b = F.writeBatch(db);
    b.set(ref('users/' + uid), { role: 'admin', name, email: String(email).trim().toLowerCase(), rooms: [] });
    b.set(ref('config/setup'), { done: true, code: String(setupCode).trim() });
    try { await b.commit(); } catch (e) { try { await Au.deleteUser(c.user); } catch (x) {} throw e; }
    try { await F.updateDoc(ref('config/setup'), { code: F.deleteField() }); } catch (e) {}
    return uid;
  };
  B.watchProfile = (uid, cb) => listen(ref('users/' + uid), cb, s => (s.exists() ? { ...s.data(), _id: s.id } : null));
  B.watchDoc = (path, cb) => listen(ref(path), cb, s => (s.exists() ? { ...s.data(), _id: s.id } : null));
  B.watchCollection = (name, cs, cb) => listen(F.query(F.collection(db, name), ...(cs || []).map(([f, op, v]) => F.where(f, op, v))), cb, snap => snap.docs.map(d => ({ ...d.data(), _id: d.id })));
  B.watchRooms = (profile, cb) => {
    if (!profile) { cb([]); return () => {}; }
    if (profile.role === 'admin') return listen(F.collection(db, 'rooms'), cb, snap => snap.docs.map(d => ({ ...d.data(), _id: d.id })));
    const ids = profile.role === 'student' ? [profile.roomId] : (profile.rooms || []);
    if (!ids.length) { cb([]); return () => {}; }
    const got = {}, unsubs = ids.map(id => F.onSnapshot(ref('rooms/' + id), s => { if (s.exists()) got[id] = { ...s.data(), _id: s.id }; else delete got[id]; cb(ids.filter(i => got[i]).map(i => got[i])); }, e => { fail(e); delete got[id]; cb(ids.filter(i => got[i]).map(i => got[i])); }));
    return () => unsubs.forEach(u => u());
  };
  const toOp = (b, o) => { if (o.op === 'set') b.set(ref(o.path), clean(o.data)); else if (o.op === 'update') b.update(ref(o.path), clean(o.data)); else if (o.op === 'del') b.delete(ref(o.path)); };
  B.batch = async (ops) => { for (let i = 0; i < ops.length; i += 400) { const b = F.writeBatch(db); ops.slice(i, i + 400).forEach(o => toOp(b, o)); await b.commit(); } };
  B.set = (path, data) => F.setDoc(ref(path), clean(data));
  B.update = (path, data) => F.updateDoc(ref(path), clean(data));
  B.del = (path) => F.deleteDoc(ref(path));
  B.removeField = (path, field) => F.updateDoc(ref(path), { [field]: F.deleteField() });
  B.putFile = async (path, file) => { await S.uploadBytes(S.ref(storage, path), file, { contentType: file.type || 'application/octet-stream' }); return { path, name: file.name, size: file.size }; };
  B.fileUrl = async (path) => { if (!urlCache.has(path)) urlCache.set(path, await S.getDownloadURL(S.ref(storage, path))); return urlCache.get(path); };
  B.delFile = async (path) => { try { await S.deleteObject(S.ref(storage, path)); } catch (e) { if (!e || e.code !== 'storage/object-not-found') throw e; } urlCache.delete(path); };
  const delPrefix = async (prefix) => { const l = await S.listAll(S.ref(storage, prefix)); await Promise.all([...l.items.map(i => S.deleteObject(i)), ...l.prefixes.map(p => delPrefix(p.fullPath))]); };
  B.deleteRoomCascade = async (roomId) => {
    const ops = [];
    for (const c of ['students', 'studentSecrets', 'assignments', 'results', 'submissions', 'users']) {
      const snap = await F.getDocs(F.query(F.collection(db, c), F.where('roomId', '==', roomId)));
      snap.docs.forEach(d => ops.push({ op: 'del', path: c + '/' + d.id }));
    }
    ops.push({ op: 'del', path: 'rooms/' + roomId });
    await B.batch(ops);
    for (const p of ['assignmentFiles/' + roomId, 'submissionFiles/' + roomId]) { try { await delPrefix(p); } catch (e) {} }
  };
  return B;
};

            return;

        const warnings = [];
        const shuffle = (a) => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) {

            [r[i], r[j]] = [r[j], r[i]];

        const base = Math.floor(pool.length / count);

        const parent = {};

        const find = (x) => (parent[x] === x ? x : (parent[x] = find(parent[x])));

        const clash = (u, g) => u.some(x => g.members.some(m => sep.has(x.id + '|' + m.id)));
        units.forEach(u => {
            if (u.length > cap)
                warnings.push(`กลุ่มล็อก (${u.map(s => s.nickname).join(', ')}) มี ${u.length} คน เกินขนาดกลุ่ม ${cap} คน`);
            u.forEach(x => u.forEach(y => { if (x.id < y.id && sep.has(x.id + '|' + y.id))
                warnings.push(`${x.nickname} กับ ${y.nickname} ถูกตั้งทั้งให้อยู่ด้วยกันและห้ามอยู่ด้วยกัน`); }));

            id: i + 1,

        }));

            ordered = [...units].sort((a, b) => minNo(a) - minNo(b));
        if (groupMethod === 'stars')
            ordered = ordered.sort((a, b) => starsOf(b) - starsOf(a));
        ordered.forEach(u => {

            }).sort((a, b) => a.over - b.over || a.score - b.score || a.size - b.size || a.r - b.r);
            const ok = scored.find(c => !clash(u, c.g));
